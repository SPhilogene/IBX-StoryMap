<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IBX StoryMap Tutorial</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  color: #222;
}

/* Style the footer */
footer {
  background-color: #8e8e8e;
  padding: 20px;
  text-align: center;

  color: white;
}

/* LANDING PAGE */

.landing-header {
  padding: 12vh 10% 8vh;
}

.eyebrow {
  font-size: 12px;
  letter-spacing: 2px;
  color: #888;
  margin-bottom: 20px;
}

.landing-header h1 {
  font-size: 48px;
  margin-bottom: 15px;
}

.landing-header > p:last-child {
  color: #777;
}

.chapter-list {
  padding: 0 10% 10vh;
}

.chapter-link {
  display: grid;
  grid-template-columns: 180px 1fr auto;
  align-items: center;
  gap: 30px;
  padding: 25px 0;
  border-top: 1px solid #ddd;
  text-decoration: none;
  color: inherit;
}

.chapter-link img {
  width: 100%;
  aspect-ratio: 4 / 3;
  object-fit: contain;
}

.chapter-link h2 {
  font-size: 26px;
  margin: 10px 0;
}

.chapter-link p {
  color: #777;
  line-height: 1.5;
}

.chapter-link:hover h2 {
  text-decoration: underline;
}

.chapter-meta {
  font-size: 12px;
  letter-spacing: 1px;
  color: #999;
}

/* CHAPTER HEADER */

.chapter-header {
  padding: 25px 5%;
  display: flex;
  justify-content: space-between;
  border-bottom: 1px solid #eee;
  font-size: 13px;
}

.chapter-header a,
.chapter-footer a {
  color: inherit;
  text-decoration: none;
}

/* SPLIT SCREEN */

.tutorial {
  display: grid;
  grid-template-columns: 1fr 1fr;
}

.steps {
  padding: 0 10%;
}

.step {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  opacity: 0.3;
  transition: opacity 0.4s ease;
}

.step.active {
  opacity: 1;
}

.step-number {
  font-size: 12px;
  letter-spacing: 2px;
  color: #999;
  margin-bottom: 25px;
}

.step h2 {
  font-size: 36px;
  margin-bottom: 20px;
}

.step p {
  font-size: 17px;
  line-height: 1.6;
  color: #777;
  max-width: 420px;
}

/* STICKY IMAGE */

.visual-panel {
  position: sticky;
  top: 0;
  height: 100vh;
  align-self: start;
}

.image-container {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #eee;
}

.tutorial-image {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0;
  transition: opacity 0.6s ease;
}

.tutorial-image.visible {
  opacity: 1;
}

.image-caption {
  position: fixed;
  bottom: 25px;
  right: 25px;
  background: white;
  padding: 12px 18px;
  font-size: 12px;
  z-index: 2;
}

/* CHAPTER FOOTER */

.chapter-footer {
  display: flex;
  justify-content: space-between;
  padding: 35px 5%;
  border-top: 1px solid #eee;
  font-size: 14px;
}

.chapter-footer a.disabled {
  opacity: 0.3;
  pointer-events: none;
}

/* MOBILE */

@media (max-width: 768px) {
  .landing-header {
    padding: 8vh 6%;
  }

  .landing-header h1 {
    font-size: 36px;
  }

  .chapter-list {
    padding: 0 6% 8vh;
  }

  .chapter-link {
    grid-template-columns: 100px 1fr;
    gap: 15px;
  }

  .chapter-link h2 {
    font-size: 19px;
  }

  .chapter-link > span:last-child {
    display: none;
  }

  .tutorial {
    grid-template-columns: 1fr;
  }

  .visual-panel {
    position: sticky;
    top: 0;
    height: 40vh;
    z-index: 5;
    grid-row: 1;
  }

  .steps {
    padding: 0 7%;
  }

  .step {
    min-height: 75vh;
  }

  .step h2 {
    font-size: 30px;
  }

  .image-caption {
    bottom: auto;
    top: calc(40vh - 45px);
    right: 15px;
  }

  .chapter-footer {
    padding: 25px 6%;
  }
}
</style>
</head>
<body>

  <header class="landing-header">
    <p class="eyebrow">A STEP-BY-STEP GUIDE</p>
    <h1>IBX StoryMap Tutorial</h1>
    <p>Walk through the full StoryMap building process, one chapter at a time. Contact <a href="mailto:sheena.philogene@brooklyn.cuny.edu?subject=IBX Guide, step 3" style="color:#001F5B">Sheena Philogene</a> with questions!</p>
  </header>

  <main class="chapter-list" id="chapter-list">
  </main>

<footer>
  <p style="text-align:center; font-size:16px;">
    Created by <a href="mailto:sheena.philogene@brooklyn.cuny.edu?subject=IBX Guide, step 3" style="color:#001F5B">Sheena Philogene</a> |
    Brooklyn College
  </p>
</footer>

<script>
/* =================================
   CHAPTER CONTENT
================================= */

const chapters = [

  {
    id: "preparation",
    title: "Getting Started - Github & Google Docs",
    description: "Link the Github and Google Docs templates to get started.",
    cover: "https://sphilogene.github.io/IBX-StoryMap/media/tutorial/github%20landing.jpg",
  },

  {
    id: "assembly",
    title: "Content/Story - Narrative & Media",
    description: "Add content like text, media, and geography.",
    cover: "https://sphilogene.github.io/IBX-StoryMap/media/tutorial/Google%20Template.png",
  },

  {
    id: "finishing",
    title: "Style Elements - Changing Fonts & Adding Links",
    description: "Refine and format elements like size and color.",
    cover: "https://sphilogene.github.io/IBX-StoryMap/media/tutorial/w3.png",
  }

];


/* =================================
   CHAPTER LANDING PAGE
================================= */

const chapterList = document.getElementById("chapter-list");

if (chapterList) {

  chapters.forEach((chapter, index) => {

    const link = document.createElement("a");

    link.className = "chapter-link";
    link.href = `chapter.html?id=${chapter.id}`;

    link.innerHTML = `
      <img src="${chapter.cover}" alt="">
      
      <div>
        <span class="chapter-meta">
          CHAPTER ${String(index + 1).padStart(2, "0")}
        </span>

        <h2>${chapter.title}</h2>

        <p>${chapter.description}</p>
      </div>

      <span>→</span>
    `;

    chapterList.appendChild(link);

  });

}


/* =================================
   CHAPTER PAGE
================================= */

const stepsContainer = document.getElementById("steps");

if (stepsContainer) {

  const params = new URLSearchParams(window.location.search);
  const chapterId = params.get("id");

  const chapterIndex = chapters.findIndex(
    chapter => chapter.id === chapterId
  );

  const chapter = chapters[chapterIndex];

  if (!chapter) {

    window.location.replace("index.html");

  } else {

    const imagesContainer =
      document.getElementById("image-container");

    const counter =
      document.getElementById("image-counter");

    const position =
      document.getElementById("chapter-position");


    /* PAGE TITLE */

    document.title = chapter.title + " | IBX StoryMap Tutorial";

    position.textContent =
      `CHAPTER ${String(chapterIndex + 1).padStart(2, "0")} / ${String(chapters.length).padStart(2, "0")}`;


    /* CREATE STEPS AND IMAGES */

    chapter.steps.forEach((step, index) => {

      const article = document.createElement("article");

      article.className = "step";
      article.dataset.step = index;

      article.innerHTML = `
        <span class="step-number">
          STEP ${String(index + 1).padStart(2, "0")} / ${String(chapter.steps.length).padStart(2, "0")}
        </span>

        <h2>${step.title}</h2>

        <p>${step.description}</p>
      `;

      stepsContainer.appendChild(article);


      const image = document.createElement("img");

      image.className = "tutorial-image";
      image.src = step.image;
      image.alt = step.title;

      imagesContainer.appendChild(image);

    });


    const steps = document.querySelectorAll(".step");
    const images = document.querySelectorAll(".tutorial-image");


    /* IMAGE SYNCHRONIZATION */

    function activateStep(index) {

      steps.forEach((step, i) => {
        step.classList.toggle("active", i === index);
      });

      images.forEach((image, i) => {
        image.classList.toggle("visible", i === index);
      });

      counter.textContent =
        `${String(index + 1).padStart(2, "0")} / ${String(steps.length).padStart(2, "0")}`;

    }


    // Use the viewport center as the activation zone.

    const observer = new IntersectionObserver(

      entries => {

        entries.forEach(entry => {

          if (entry.isIntersecting) {

            const index = Number(entry.target.dataset.step);

            activateStep(index);

          }

        });

      },

      {
        root: null,
        rootMargin: "-40% 0px -40% 0px",
        threshold: 0
      }

    );


    steps.forEach(step => observer.observe(step));

    activateStep(0);


    /* PREVIOUS / NEXT CHAPTER */

    const previous = document.getElementById("previous-chapter");
    const next = document.getElementById("next-chapter");

    if (chapterIndex > 0) {

      previous.href =
        `chapter.html?id=${chapters[chapterIndex - 1].id}`;

    } else {

      previous.classList.add("disabled");
      previous.setAttribute("aria-disabled", "true");

    }

    if (chapterIndex < chapters.length - 1) {

      next.href =
        `chapter.html?id=${chapters[chapterIndex + 1].id}`;

    } else {

      next.href = "index.html";
      next.textContent = "Back to all chapters →";

    }

  }

}

</script>
</body>
</html>
